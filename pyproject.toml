[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digikey-list-mcp"
version = "0.1.0"
description = "Agent-friendly DigiKey Product Information and MyLists MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "mcp>=2,<3",
  "platformdirs>=4,<5",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "PyYAML>=6,<7",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
digikey-list-mcp = "digikey_list_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/digikey_list_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
